<!DOCTYPE html>
<html>
<head>
    <title>Bài tập của Lâm Gia Phúc</title>
    <style>
        @keyframes colorChange1 {
            0% { color: red; }
            20% { color: lightcoral; }
            30% { color: limegreen; }
            40% { color: gold; }
            50% { color: lightblue; }
            60% { color: blue; }
            70% { color: yellow; }
            80% { color: purple; }
            90% { color: navy; }
            100% { color: green; }
        }

        @keyframes colorChange2 {
            0% { color: red; }
            100% { color: white; }
        }

        h1 {
            animation: colorChange2 1s infinite;
            font-size: 40px;
            text-align: center;
            line-height: 0.5cm;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: red;
        }

        h3 {
            animation: colorChange1 0.8s infinite;
            text-align: center;
        }

        body {
            background-color: white;
        }

        #marquee {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: black;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <table border="1" width="100%">
        <tr>
            <th colspan="2">
                <h1>Bài tập của Lâm Gia Phúc</h1>
            </th>
        </tr>
        <tr>
            <td width="30%" style="background-color: lightcyan;">
                <iframe src="DanhMucBT.html" width="100%" height="300px"></iframe>
            </td>
            <td width="70%">
                <iframe name="noidung" width="100%" height="300px"></iframe>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <div id="marquee">
                    <marquee behavior="scroll" direction="left" loop="infinite" id="myMarquee">
                        Chúc bạn 1 ngày tốt lành.
                    </marquee>
                </div>
            </td>
        </tr>
    </table>

    <script>
        const marquee = document.getElementById("myMarquee");

        function changeTextProperties() {
            const colors = ["red", "blue", "green", "orange", "purple", "brown", "cyan", "magenta", "yellowgreen", "pink"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            marquee.style.color = randomColor;
        }

        let scrollAmount = 30;
        let loopCount = ;
        let currentLoop = 0;

        marquee.addEventListener('finish', () => {
            currentLoop++;
            changeTextProperties();

            if (currentLoop < loopCount) {
                marquee.start();
            } else {
                marquee.stop();
                currentLoop = 0;
            }
        });

        marquee.setAttribute('scrollamount', 50);
        changeTextProperties();
        marquee.start();
    </script>
</body>
</html>
