  <style>
    @keyframes colorChange {
      0% { color: red; }
      20% { color: lightcoral; }
      30% { color: limegreen; }
      40% { color: gold; }
      50% { color: lightblue; }
      60% { color: blue; }
      70% { color: yellow; } nd
      80% { color: purple; }
      90% { color: navy; }
      100% { color: green; }
    }

    h1 {
      animation: colorChange 3s infinite;
      font-size: 50px;
      text-align: center;
      background-color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
    }

    p {
      font-size: 30px;
      text-align: center;
      line-height: 0.5cm;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: hotpink;
    }

    a {
      font-size: 30px;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-decoration: none;
    }

    h3 {
      font-size: 30px;
      text-align: center;
      color: gold;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2 {
      font-size: 30px;
      text-align: center;
      color: lightblue;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    @keyframes grow {
      0%, 100% {
        height: 40px;
        transform: translateY(0);
      }
      50% {
        height: 80px;
        transform: translateY(-40px);
      }
    }

    .bar-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
    }

    .bar {
      width: 3%;
      margin: 0 1%;
      background-color: #00c3ff;
      border-radius: 10px;
      animation: grow 1s infinite;
      animation-delay: calc(0.2s * var(--i));
    }

    .bar:nth-child(4) {
      background-color: #a28dff;
    }

    .bar:nth-child(5) {
      background-color: #ff6ec4;
    }

    .bar:nth-child(6) {
      background-color: #ff6347;
    }

    .bar:nth-child(7) {
      background-color: #32cd32;
    }

    .bar:nth-child(8) {
      background-color: #ff4500;
    }

    .bar:nth-child(9) {
      background-color: #ff1493;
    }

    .bar:nth-child(10) {
      background-color: #1e90ff;
    }

    .bar:nth-child(11) {
      background-color: #ffff00;
    }

    .bar:nth-child(12) {
      background-color: #8a2be2;
    }

    .bar:nth-child(13) {
      background-color: #a28dff;
    }

    .bar:nth-child(14) {
      background-color: #ff6ec4;
    }

    .bar:nth-child(15) {
      background-color: #ff6347;
    }

    .bar:nth-child(16) {
      background-color: #32cd32;
    }

    .bar:nth-child(17) {

    }

    .bar:nth-child(18) {
      background-color: #ff1493;
    }

    .bar:nth-child(19) {
      background-color: #1e90ff;
    }

    .bar:nth-child(20) {
      background-color: #ffff00;
    }

    .bar:nth-child(21) {
      background-color: #8a2be2;
    }
  </style>
