<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>THPT Ngô Quyền</title>
    <style>
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        .header {
            font-size: 50px;
            text-align: center;
            background-image: linear-gradient(90deg, #00c6a7, #1e90ff, #ff6ec7, #00c6a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 400% 100%;
            animation: gradientAnimation 10s linear infinite;
            line-height: 1.5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: normal;
            background-color: lightpink;
            display: inline-block;
            padding: 10px 20px;
        }

        body {
            transition: background-color 0.5s ease;
        }

        .menu {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            display: flex;
            padding: 5px 0;
        }

        .menu a {
            flex: 1;
            display: block;
            background-color: black;
            text-align: center;
            padding: 8px 0;
            text-decoration: none;
            color: white;
            font-style: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            font-size: 0.9em;
        }

        .menu a:hover {
            background-color: lightcyan;
            color: black;
            transform: scale(1.15);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .menu a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 2px;
            background-color: lightcyan;
            transition: width 0.3s ease;
        }

        .menu a:hover::after {
            width: 70%;
        }
    </style>
</head>
<body>
    <div class="header">
        THPT Ngô Quyền
    </div>
    <div class="menu">
        <a href="contents/gioithieu.html" target="noidung">Giới thiệu</a>
        <a href="contents/tkb.html" target="noidung">Thời khóa biểu</a>
        <a href="contents/tkvm.html" target="noidung">Hướng nghiệp</a>
        <a href="contents/Bai7-NV1.html" target="noidung">Góp ý</a>
        <a href="contents/game.html" target="noidung">Game</a>
        <a href="dangnhap.html" target="noidung">Đăng nhập</a>
    </div>
    <button id="toggleBackground">Đổi nền</button>
    <iframe name="noidung" id="myFrame" width="100%" height="500px"></iframe>
    <script>
        const toggleButton = document.getElementById("toggleBackground");
        let isDark = false;
        const myFrame = document.getElementById("myFrame");

        toggleButton.addEventListener("click", () => {
            if (isDark) {
                document.body.style.backgroundColor = "white";
                if(myFrame.contentWindow && myFrame.contentWindow.document){
                    myFrame.contentWindow.document.body.style.color = "black";
                }
            } else {
                document.body.style.backgroundColor = "black";
                if(myFrame.contentWindow && myFrame.contentWindow.document){
                    myFrame.contentWindow.document.body.style.color = "white";
                }
            }
            isDark = !isDark;
        });

        myFrame.onload = function() {
            adjustIframeHeight();
        };

        function adjustIframeHeight() {
            if (myFrame.contentWindow && myFrame.contentWindow.document) {
                myFrame.style.height = myFrame.contentWindow.document.body.scrollHeight + 'px';
            }
        }
    </script>
</body>
</html>
